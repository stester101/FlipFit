name: Build FlipFit APK
on:
  workflow_dispatch:
  push:
    branches: [ main, v0.5.0-workout-parity ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Gradle wrapper binary exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FlipFit-v0.5.0-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipFit-v0.5.0-APK
          path: FlipFit-v0.5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
